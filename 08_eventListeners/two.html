<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Async</h1>
    <button id="stop">Stop</button>
  </body>

  <script>
    setTimeout(function () {
      console.log("Hi amulya");
    }, 2000); //print hii amulya after 2 sec;

    //Above function can also be written as:
    const sayHii = function () {
      console.log("Hi amulya");
    };

    setTimeout(sayHii, 2000); //print hii amulya after 2

    const changeText = function () {
      document.querySelector("h1").innerHTML = "Learning JS";
    };

    const changeMe = setTimeout(changeText, 2000);

    document.querySelector("#stop").addEventListener("click", function () {
      clearTimeout(changeMe);
      console.log("STOPPED");
    });
  </script>
</html>
